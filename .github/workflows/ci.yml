name: Torrenter CI

on:
  push:
    branches:
      - "**"
    pull_request:
      - main


jobs:
  build:
    name: Build the program
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"

      - name: Install dependencies
        run: go mod tidy

      - name: Build 
        run: go build -o ./bin/torrenter ./cmd/torrenter
    
